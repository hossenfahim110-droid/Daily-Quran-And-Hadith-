    <script>
        // ৪০টি বাছাইকৃত সহীহ হাদিসের ডেটাবেজ
        const hadiths = [
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'সমস্ত কাজের ফলাফল নিয়তের ওপর নির্ভর করে।'", source: "সহীহ বুখারী: ১", topic: "নিয়ত" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'তোমাদের মধ্যে সেই ব্যক্তি সর্বোত্তম, যে কুরআন শেখে এবং অন্যকে শেখায়।'", source: "সহীহ বুখারী: ৫০২৭", topic: "কুরআন শিক্ষা" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'পবিত্রতা ঈমানের অর্ধেক।'", source: "সহীহ মুসলিম: ২২৩", topic: "পবিত্রতা" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'যে ব্যক্তি পথ চলায় ইলম (জ্ঞান) অন্বেষণ করে, আল্লাহ তার জন্য জান্নাতের পথ সহজ করে দেন।'", source: "সহীহ মুসলিম: ২৬৯৯", topic: "জ্ঞান অর্জন" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'তোমাদের কেউ প্রকৃত মুমিন হতে পারবে না, যতক্ষণ না সে তার ভাইয়ের জন্য তা-ই পছন্দ করে যা নিজের জন্য পছন্দ করে।'", source: "সহীহ বুখারী: ১৩", topic: "ভ্রাতৃত্ব" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'যে ব্যক্তি আল্লাহর ওপর এবং শেষ দিনের ওপর বিশ্বাস রাখে, সে যেন ভালো কথা বলে অথবা চুপ থাকে।'", source: "সহীহ বুখারী: ৬০১৮", topic: "আচরণ" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'প্রকৃত শক্তিশালী সে নয় যে কুস্তিতে কাউকে হারিয়ে দেয়, বরং শক্তিশালী সে যে রাগের মাথায় নিজেকে নিয়ন্ত্রণে রাখতে পারে।'", source: "সহীহ বুখারী: ৬১১৪", topic: "আত্মসংযম" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'আল্লাহর কাছে সবচেয়ে প্রিয় আমল তা-ই, যা নিয়মিত করা হয়—যদিও তা পরিমাণে অল্প হয়।'", source: "সহীহ বুখারী: ৬৪৬৫", topic: "ধারাবাহিকতা" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'যে আত্মীয়তার সম্পর্ক ছিন্ন করে, সে জান্নাতে প্রবেশ করবে না।'", source: "সহীহ বুখারী: ৫৯৮৪", topic: "আত্মীয়তা" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'তোমরা হিংসা-বিদ্বেষ থেকে বেঁচে থাকো, কারণ হিংসা নেক আমলকে এমনভাবে ধ্বংস করে যেমন আগুন কাঠকে পুড়িয়ে ছাই করে।'", source: "সূনান আবু দাউদ: ৪৯০৩", topic: "হিংসা ত্যাগ" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'দয়া প্রদর্শন করো, তোমার ওপর দয়া করা হবে। আর ক্ষমা করে দাও, তোমাকে ক্ষমা করে দেওয়া হবে।'", source: "মুসনাদে আহমাদ: ৬৫৪১", topic: "দয়া ও ক্ষমা" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'দুটি নেয়ামতের ব্যাপারে অধিকাংশ মানুষ ধোঁকায় থাকে—স্বাস্থ্ এবং অবসর সময়।'", source: "সহীহ বুখারী: ৬৪১২", topic: "সময় ও স্বাস্থ্য" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'যে ব্যক্তি কোনো ভালো কাজের পথ দেখায়, সে কাজটির বাস্তবায়নকারীর সমান সওয়াব পায়।'", source: "সহীহ মুসলিম: ১৮৯৩", topic: "সৎকাজের উৎসাহ" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'কিয়ামতের দিন বান্দার হিসাবের মধ্যে সর্বপ্রথম সালাতের (নামাজের) হিসাব নেওয়া হবে।'", source: "সূনান তিরমিযী: ৪১৩", topic: "সালাত" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'নিশ্চয়ই আল্লাহ সুন্দর, তিনি সৌন্দর্যকে পছন্দ করেন।'", source: "সহীহ মুসলিম: ৯১", topic: "সৌন্দর্য" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'মানুষের প্রতি যে অকৃজ্ঞ, সে আল্লাহর প্রতিও অকৃজ্ঞ।'", source: "সূনান আবু দাউদ: ৪৮১১", topic: "কৃতজ্ঞতা" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'যে ব্যক্তি প্রতিদিন সকালে ও সন্ধ্যায় ১০০ বার 'সুবহানাল্লাহি ওয়া বিহামদিহি' পড়বে, তার সমুদ্রের ফেনা পরিমাণ গুনাহও ক্ষমা করে দেওয়া হবে।'", source: "সহীহ বুখারী: ৬৪০৫", topic: "জিকির" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'যে ব্যক্তি কোনো মুসলিমের এক কষ্ট দূর করে দেবে, আল্লাহ কিয়ামতের দিন তার কষ্টগুলো থেকে একটি বড় কষ্ট দূর করবেন।'", source: "সহীহ বুখারী: ২৪৪২", topic: "উপকারিতা" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'সত্য মানুষকে পুণ্য ও জান্নাতের দিকে নিয়ে যায়, আর মিথ্যা মানুষকে পাপ ও জাহান্নামের দিকে নিয়ে যায়।'", source: "সহীহ বুখারী: ৬০৯৪", topic: "সত্যবাদিতা" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'মুমিন ব্যক্তি একই গর্ত থেকে দু'বার দংশিত হয় না।'", source: "সহীহ বুখারী: ৬১৩৩", topic: "সচেতনতা" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'উত্তম চরিত্রই পুণ্য।'", source: "সহীহ মুসলিম: ২৫৫৩", topic: "চরিত্র" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'তোমরা সহজ করো, কঠিন করো না; সুসংবাদ দাও, মানুষকে দূরে ঠেলে দিয়ো না।'", source: "সহীহ বুখারী: ৬৯", topic: "সহজীকরণ" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'যে লোক মানুষের ওপর দয়া করে না, আল্লাহও তার ওপর দয়া করেন না।'", source: "সহীহ বুখারী: ৭৩৭৬", topic: "দয়া" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'তোমার হাসিমুখ তোমার ভাইয়ের জন্য একটি সদকা।'", source: "সূনান তিরমিযী: ১৯৫৬", topic: "সদকা" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'আল্লাহর সন্তুষ্টি পিতার সন্তুষ্টির ওপর নির্ভর করে এবং আল্লাহর অসন্তুষ্টি পিতার অসন্তুষ্টির ওপর।'", source: "সূনান তিরমিযী: ১৮৯৯", topic: "পিতা-মাতার মর্যাদা" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'দু'আ হলো ইবাদতের মূল।'", source: "সূনান তিরমিযী: ৩৩৭১", topic: "দু'আ" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'যে ব্যক্তি জুমার দিনে সূরা কাহফ পাঠ করবে, তার জন্য এক জুমা থেকে অপর জুমা পর্যন্ত আলো উজ্জ্বল থাকবে।'", source: "সূনান কুবরা বায়হাকী: ২৪৪৪", topic: "জুমার আমল" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'যে ব্যক্তি তার ভাইয়ের অনুপস্থিতে তার জন্য দুআ করে, তার দুআ কবুল করা হয়।'", source: "সহীহ মুসলিম: ২৭৩২", topic: "দু'আ" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'যে ব্যক্তি আল্লাহর জন্য একটি মসজিদ নির্মাণ করে, আল্লাহ তার জন্য জান্নাতে একটি ঘর নির্মাণ করেন।'", source: "সহীহ বুখারী: ৪৫০", topic: "মসজিদ" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'যে ব্যক্তি জান্নাতের গ্যারান্টি চায়, সে যেন তার জিহ্বা ও লজ্জাস্থানের হেফাজত করে।'", source: "সহীহ বুখারী: ৬৪৭৪", topic: "জিহ্বা হেফাজত" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'যার মনে অনু পরিমাণ অহংকার থাকবে, সে জান্নাতে প্রবেশ করবে না।'", source: "সহীহ মুসলিম: ৯১", topic: "অহংকার ত্যাগ" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'মুমিনের ঈমানের দিক দিয়ে সবচেয়ে পরিপূর্ণ ব্যক্তি সে, যার চরিত্র সবচেয়ে সুন্দর।'", source: "সূনান আবু দাউদ: ৪৬৮২", topic: "সুন্দর চরিত্র" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'যে লানত বা অভিশাপ দেয়, সে সিদ্দীক (সত্যবাদী) হতে পারে না।'", source: "সহীহ মুসলিম: ২৫৯৭", topic: "কটু কথা" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'হারাম খাদ্য খেয়ে গড়ে ওঠা শরীর জান্নাতে প্রবেশ করবে না।'", source: "বায়হাকী: ৫৭৫৮", topic: "হালাল খাবার" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'তোমরা مظلوم (নির্যাতিত)-এর দুআকে ভয় করো, কারণ তার দুআ ও আল্লাহর মাঝে কোনো পর্দা থাকে না।'", source: "সহীহ বুখারী: ২৪৪৮", topic: "মজলুমের দু'আ" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'লজ্জাশীলতা ঈমানেরই একটি বিশেষ অংশ।'", source: "সহীহ বুখারী: ৯", topic: "লজ্জাশীলতা" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'কোনো মুসলিম যখন কোনো বৃক্ষ রোপণ করে আর তা থেকে মানুষ বা পশু খায়, তবে তা তার জন্য সদকা হিসেবে গণ্য হয়।'", source: "সহীহ বুখারী: ২৩২০", topic: "বৃক্ষরোপণ" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'জান্নাত মায়ের পায়ের নিচে।' (মায়ের খিদমতে জান্নাত পাওয়া যায়)", source: "সূনান নাসায়ী: ৩১০৪", topic: "মায়ের মর্যাদা" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'তোমাদের মধ্যে সেরা সেই ব্যক্তি, যে তার স্ত্রীর কাছে সেরা।'", source: "সূনান তিরমিযী: ৩৮৯৫", topic: "পরিবার" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'সবচেয়ে বড় কাবিরা গুনাহ হলো আল্লাহর সাথে শরিক করা, মা-বাবার অবাধ্য হওয়া এবং মিথ্যা সাক্ষ্য দেওয়া।'", source: "সহীহ বুখারী: ২৬৫৪", topic: "কবিরা গুনাহ" }
        ];

        let currentIndex = 0;

        function showNextHadith() {
            const currentHadith = hadiths[currentIndex];
            
            const textElem = document.getElementById('hadith-text');
            const sourceElem = document.getElementById('hadith-source');
            const topicElem = document.getElementById('hadith-topic');
            const counterElem = document.getElementById('hadith-counter');

            // হালকা ট্রানজিশন ইফেক্ট
            textElem.style.opacity = '0';
            
            setTimeout(() => {
                textElem.innerText = `"${currentHadith.text}"`;
                sourceElem.innerText = currentHadith.source;
                topicElem.innerText = `বিষয়: ${currentHadith.topic}`;
                counterElem.innerText = `${currentIndex + 1}/${hadiths.length}`;
                
                textElem.style.opacity = '1';
                currentIndex = (currentIndex + 1) % hadiths.length;
            }, 300);
        }

        // প্রারম্ভিক হাদিস লোড
        showNextHadith();

        // প্রতি ৫ সেকেন্ড (৫০০০ মিলি-সেকেন্ড) পর পর হাদিস পরিবর্তন
        setInterval(showNextHadith, 5000);
    </script>
</body>
</html>
