<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islamic Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-emerald-50 text-gray-800 font-sans">

    <!-- Header -->
    <header class="bg-emerald-700 text-white text-center py-6 shadow-lg">
        <h1 class="text-2xl font-bold">Islamic Information Portal</h1>
        <p class="text-xs mt-1">Al-Quran o Namazer Somoy</p>
    </header>

    <div class="max-w-md mx-auto p-4 space-y-5">

        <!-- Prayer Times Section -->
        <div class="bg-white p-5 rounded-xl shadow border-t-4 border-emerald-600">
            <h2 class="text-lg font-bold text-emerald-800 mb-3">Aajker Namazer Somoy (Dhaka)</h2>
            <div id="prayer-times" class="grid grid-cols-2 gap-2 text-center text-sm">
                <p class="col-span-2 text-gray-500">Loading...</p>
            </div>
        </div>

        <!-- Quran Surah List Section -->
        <div class="bg-white p-5 rounded-xl shadow border-t-4 border-emerald-600">
            <h2 class="text-lg font-bold text-emerald-800 mb-3">Al-Quran Surah List</h2>
            <ul id="surah-list" class="space-y-2 max-h-60 overflow-y-auto text-sm">
                <li class="text-gray-500">Loading Surahs...</li>
            </ul>
        </div>

    </div>

    <!-- API Script -->
    <script>
        fetch('https://api.aladhan.com/v1/timingsByCity?city=Dhaka&country=Bangladesh&method=2')
            .then(res => res.json())
            .then(data => {
                const t = data.data.timings;
                document.getElementById('prayer-times').innerHTML = `
                    <div class="bg-emerald-100 p-2 rounded"><b>Fajr:</b> ${t.Fajr}</div>
                    <div class="bg-emerald-100 p-2 rounded"><b>Dhuhr:</b> ${t.Dhuhr}</div>
                    <div class="bg-emerald-100 p-2 rounded"><b>Asr:</b> ${t.Asr}</div>
                    <div class="bg-emerald-100 p-2 rounded"><b>Maghrib:</b> ${t.Maghrib}</div>
                    <div class="bg-emerald-100 p-2 rounded"><b>Isha:</b> ${t.Isha}</div>
                `;
            });

        fetch('https://api.alquran.cloud/v1/surah')
            .then(res => res.json())
            .then(data => {
                const surahs = data.data.slice(0, 15);
                let html = '';
                surahs.forEach(s => {
                    html += `<li class="p-2 border rounded flex justify-between bg-gray-50">
                        <span>${s.number}. <b>${s.englishName}</b></span>
                        <span class="text-xs bg-emerald-200 px-2 py-0.5 rounded">${s.name}</span>
                    </li>`;
                });
                document.getElementById('surah-list').innerHTML = html;
            });
    </script>
</body>
</html>
