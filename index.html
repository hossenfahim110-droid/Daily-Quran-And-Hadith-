            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'তোমাদের মধ্যে সেই ব্যক্তি সর্বোত্তম, যে কুরআন শেখে এবং অন্যকে শেখায়।'", source: "সহীহ বুখারী: ৫০২৭" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'নিশ্চয়ই নিয়তের ওপরই সমস্ত কাজের ফলাফল নির্ভর করে।'", source: "সহীহ বুখারী: ১" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'পবিত্রতা ঈমানের অর্ধেক।'", source: "সহীহ মুসলিম: ২২৩" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'যে ব্যক্তি আল্লাহর সন্তুষ্টির জন্য একটি মসজিদ নির্মাণ করবে, আল্লাহ তার জন্য জান্নাতে একটি ঘর তৈরি করবেন।'", source: "সহীহ বুখারী: ৪৫০" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'সহজ করো, কঠিন করো না; সুসংবাদ দাও, ভিটি প্রদর্শন করো না।'", source: "সহীহ বুখারী: ৬৯" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'প্রকৃত মুসলিম সে-ই, যার জিহ্বা ও হাত থেকে অন্য মুসলিম নিরাপদ থাকে।'", source: "সহীহ বুখারী: ১০" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'যে ব্যক্তি আল-কুরআনের একটি হরফ পাঠ করবে, সে একটি নেকি পাবে, আর একটি নেকি দশটির সমান।'", source: "জামে আত-তিরমিজী: ২৯১০" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'দোয়া হলো ইবাদতের মূল।'", source: "জামে আত-তিরমিজী: ৩৩৭১" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'তোমাদের কেউ ততক্ষণ পর্যন্ত পূর্ণ ঈমানদার হতে পারবে না, যতক্ষণ না সে তার ভাইয়ের জন্য তা-ই পছন্দ করে যা নিজের জন্য করে।'", source: "সহীহ বুখারী: ১৩" },

            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'বান্দা সিজদারত অবস্থায় আল্লাহর সবচেয়ে নিকটবর্তী হয়, তাই তখন বেশি বেশি দোয়া করো।'", source: "সহীহ মুসলিম: ৪৮২" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'মজলুমের বদদোয়াকে ভয় করো, কারণ তার বদদোয়া ও আল্লাহর মধ্যে কোনো পর্দা থাকে না।'", source: "সহীহ বুখারী: ২৪৪৮" },

            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'শক্তিশালী ব্যক্তি সে নয় যে কুস্তিতে হারিয়ে দেয়, বরং শক্তিশালী সে যে রাগের মাথায় নিজেকে নিয়ন্ত্রণে রাখে।'", source: "সহীহ বুখারী: ৬১১৪" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'তোমাদের মধ্যে তারাই আমার কাছে সবচেয়ে প্রিয় এবং কিয়ামতের দিন সবচেয়ে নিকটবর্তী হবে, যাদের চরিত্র সবচেয়ে সুন্দর।'", source: "জামে আত-তিরমিজী: ২০১১৮" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'যে ব্যক্তি আমার ওপর একবার দরূদ পাঠ করবে, আল্লাহ তার ওপর দশটি রহমত বর্ষণ করবেন।'", source: "সহীহ মুসলিম: ৪০৮" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'প্রতিটি ভালো কাজই একটি দান (সদকা)।'", source: "সহীহ বুখারী: ৬০২১" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'যে ব্যক্তি জ্ঞান অর্জনের উদ্দেশ্যে বের হয়, সে ফিরে না আসা পর্যন্ত আল্লাহর রাস্তায় থাকে।'", source: "জামে আত-তিরমিজী: ২৬৪৭" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'তুমি যেখানেই থাকো আল্লাহকে ভয় করো, মন্দের পর ভালো কাজ করো যা মন্দকে মুছে দেবে এবং মানুষের সাথে সুন্দর আচরণ করো।'", source: "জামে আত-তিরমিজী: ১৯৮৭" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'জান্নাত মাতাদের পায়ের নিচে।'", source: "সুনান আন-নাসায়ী: ৩১০৪" },

            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'যে ব্যক্তি সকালে ও সন্ধ্যায় তিনবার 'বিসমিল্লাহিল্লাজি লা ইয়াদুররু...' পড়বে, কোনো কিছুই তার ক্ষতি করতে পারবে না।'", source: "সুনান আবু দাউদ: ৫০৮৮" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'পাঁচ ওয়াক্ত সালাত এবং এক জুমআ থেকে পরবর্তী জুমআ অন্তর্বর্তীকালীন গুনাহের কাফফারা স্বরূপ।'", source: "সহীহ মুসলিম: ২৩৩" },

            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'কৃপণ সে ব্যক্তি, যার সামনে আমার নাম উচ্চারিত হলো কিন্তু সে দরূদ পাঠ করল না।'", source: "জামে আত-তিরমিজী: ৩৫৪৬" },

            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'যে ব্যক্তি ক্ষমা করে, আল্লাহ তার সম্মান বাড়িয়ে দেন।'", source: "সহীহ মুসলিম: ২৫৮৮" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'তোমাদের কেউ যেন হেলান দিয়ে খাবার না খায়।'", source: "সহীহ বুখারী: ৫৩৯০" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'যে লোক মানুষের প্রতি কৃতজ্ঞতা প্রকাশ করে না, সে আল্লাহর প্রতিও কৃতজ্ঞ হয় না।'", source: "সুনান আবু দাউদ: ৪৮১১" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'আল্লাহ সুন্দর এবং তিনি সৌন্দর্য পছন্দ করেন।'", source: "সহীহ মুসলিম: ৯১" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'রহমান (আল্লাহ) দয়ালুদের প্রতি দয়া করেন। তোমরা জমিনে যারা আছে তাদের প্রতি দয়া করো, আসমানের সত্তা তোমাদের প্রতি দয়া করবেন।'", source: "সুনান আবু দাউদ: ৪৯৪১" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'তোমাদের কেউ যেন বাম হাত দিয়ে না খায় এবং না পান করে, কারণ শয়তান বাম হাতে খায় ও পান করে।'", source: "সহীহ মুসলিম: ২০২১" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'আল্লাহ তোমাদের চেহারা ও সম্পদের দিকে তাকান না, বরং তিনি তাকান তোমাদের অন্তর ও আমলের দিকে।'", source: "সহীহ মুসলিম: ২৫৬৪" },

            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'লজ্জাশীলতা ঈমানেরই অঙ্গ।'", source: "সহীহ বুখারী: ২৪" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'তোমরা হিংসা-বিদ্বেষ থেকে বেঁচে থাকো, কারণ হিংসা নেকিগুলোকে এমনভাবে খেয়ে ফেলে যেমন আগুন কাঠকে খেয়ে ফেলে।'", source: "সুনান আবু দাউদ: ৪৯০৩" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'যে ব্যক্তি আমার ওপর মিথ্যা কথা বলবে, সে যেন তার ঠিকানা জাহান্নামে বানিয়ে নেয়।'", source: "সহীহ বুখারী: ১১০" },
            { text: "রাসূলুল্লাহ (ﷺ) বলেছেন: 'উত্তম কথা বলাও এক ধরণের সদকা।'", source: "সহীহ বুখারী: ২৯৮৯" }

        let hadithIndex = 0;

        function updateHadith() {
            const textElement = document.getElementById('hadith-text');
            const sourceElement = document.getElementById('hadith-source');
            const counterElement = document.getElementById('hadith-counter');

            // Fade animation logic
            textElement.style.opacity = '0';
            
            setTimeout(() => {
                textElement.innerText = sahihHadiths[hadithIndex].text;
                sourceElement.innerText = sahihHadiths[hadithIndex].source;
                counterElement.innerText = `হাদিস ${hadithIndex + 1} / ${sahihHadiths.length}`;
                textElement.style.opacity = '1';
                
                hadithIndex = (hadithIndex + 1) % sahihHadiths.length;
            }, 300);
        }

        // Initialize and Set 8 Seconds Interval
        updateHadith();
        setInterval(updateHadith, 8000);
    </script>
</body>
